services:
  mysql:
    image: mysql:8.0
    container_name: ${MYSQL_CONTAINER_NAME}
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
    volumes:
      - mysql_data:/var/lib/mysql
      - ./db:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 15
  mongodb:
    image: mongo:8.0
    container_name: ${MONGODB_CONTAINER_NAME}
    volumes:
      - mongodb_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 240s
  rabbitmq:
    image: rabbitmq:3.13-alpine
    container_name: ${RABBITMQ_CONTAINER_NAME}
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS}
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "check_port_connectivity"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 240s
  user-service:
    build:
      context: ./apps/user-service
      dockerfile: Dockerfile
    container_name: ${USER_SERVICE_CONTAINER_NAME}
    environment:
      USER_SERVICE_DATASOURCE_URL: ${USER_SERVICE_DATASOURCE_URL}
      USER_SERVICE_DATASOURCE_USERNAME: ${USER_SERVICE_DATASOURCE_USERNAME}
      USER_SERVICE_DATASOURCE_PASSWORD: ${USER_SERVICE_DATASOURCE_PASSWORD}
      USER_SERVICE_DATASOURCE_DRIVER: ${USER_SERVICE_DATASOURCE_DRIVER}
      RABBITMQ_URI: amqp://${RABBITMQ_DEFAULT_USER}:${RABBITMQ_DEFAULT_PASS}@rabbitmq:5672
      JWT_SECRET: ${JWT_SECRET}
      API_BASE_URL: ${API_BASE_URL}
    depends_on:
      mysql:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
  product-service:
    build:
      context: ./apps/product-service
      dockerfile: Dockerfile
    container_name: ${PRODUCT_SERVICE_CONTAINER_NAME}
    environment:
      PRODUCT_SERVICE_PORT: ${PRODUCT_SERVICE_PORT}
      PRODUCT_SERVICE_DATASOURCE_URL: ${PRODUCT_SERVICE_DATASOURCE_URL}
      PRODUCT_SERVICE_DATASOURCE_USERNAME: ${PRODUCT_SERVICE_DATASOURCE_USERNAME}
      PRODUCT_SERVICE_DATASOURCE_PASSWORD: ${PRODUCT_SERVICE_DATASOURCE_PASSWORD}
      RABBITMQ_URI: amqp://${RABBITMQ_DEFAULT_USER}:${RABBITMQ_DEFAULT_PASS}@rabbitmq:5672
      MONGODB_URI: ${PRODUCT_SERVICE_MONGODB_URI}
      JWT_SECRET: ${JWT_SECRET}
      API_BASE_URL: ${API_BASE_URL}
    depends_on:
      mysql:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      mongodb:
        condition: service_healthy
  sale-service:
    build:
      context: ./apps/sale-service
      dockerfile: Dockerfile
    container_name: ${SALE_SERVICE_CONTAINER_NAME}
    environment:
      SALE_SERVICE_PORT: ${SALE_SERVICE_PORT}
      SALE_SERVICE_DATASOURCE_URL: ${SALE_SERVICE_DATASOURCE_URL}
      SALE_SERVICE_DATASOURCE_USERNAME: ${SALE_SERVICE_DATASOURCE_USERNAME}
      SALE_SERVICE_DATASOURCE_PASSWORD: ${SALE_SERVICE_DATASOURCE_PASSWORD}
      RABBITMQ_URI: amqp://${RABBITMQ_DEFAULT_USER}:${RABBITMQ_DEFAULT_PASS}@rabbitmq:5672
      MONGODB_URI: ${SALE_SERVICE_MONGODB_URI}
      USER_ROUTE: ${USER_ROUTE}
      PRODUCT_ROUTE: ${PRODUCT_ROUTE}
      JWT_SECRET: ${JWT_SECRET}
      API_BASE_URL: ${API_BASE_URL}
    depends_on:
      mysql:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      mongodb:
        condition: service_healthy
  rating-service:
    build:
      context: ./apps/rating-service/src
      dockerfile: Dockerfile
    container_name: ${RATING_SERVICE_CONTAINER_NAME}
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_HTTP_PORTS: "8083"
      MongoDB__Uri: ${RATING_SERVICE_MONGODB_URI}
      RabbitMQ__ConnectionString: amqp://${RABBITMQ_DEFAULT_USER}:${RABBITMQ_DEFAULT_PASS}@rabbitmq:5672
      SaleService__BaseUrl: ${SALE_ROUTE}
      JWT_SECRET: ${JWT_SECRET}
      API_BASE_URL: ${API_BASE_URL}
    depends_on:
      mongodb:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      sale-service:
        condition: service_started
  api-gateway:
    build:
      context: ./apps/api-gateway
      dockerfile: Dockerfile
    container_name: ${API_GATEWAY_CONTAINER_NAME}
    ports:
      - "${API_GATEWAY_PORT}:8090"
    environment:
      SERVER_PORT: "8090"
      USER_ROUTE: ${USER_ROUTE}
      PRODUCT_ROUTE: ${PRODUCT_ROUTE}
      CATEGORY_ROUTE: ${CATEGORY_ROUTE}
      SELLER_ROUTE: ${SELLER_ROUTE}
      SALE_ROUTE: ${SALE_ROUTE}
      RATING_ROUTE: ${RATING_ROUTE}
      JWT_SECRET: ${JWT_SECRET}
    depends_on:
      - user-service
      - product-service
      - sale-service
      - rating-service
volumes:
  mysql_data:
  mongodb_data:
  rabbitmq_data: