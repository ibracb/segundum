server.port=${SERVER_PORT}
spring.application.name=api-gateway

zuul.sensitiveHeaders=

zuul.routes.users.path = /users/**
zuul.routes.users.url = ${USER_ROUTE}

zuul.routes.products.path = /products/**
zuul.routes.products.url = ${PRODUCT_ROUTE}

zuul.routes.category.path = /categories/**
zuul.routes.category.url = ${CATEGORY_ROUTE}

zuul.routes.seller.path = /sellers/**
zuul.routes.seller.url = ${SELLER_ROUTE}

zuul.routes.sales.path=/sales/**
zuul.routes.sales.url=${SALE_ROUTE}

user.route=${USER_ROUTE}

# JWT
jwt.secret=${JWT_SECRET}
jwt.expiration=3600